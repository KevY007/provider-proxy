name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proxy
          POSTGRES_PASSWORD: proxy
          POSTGRES_DB: proxy
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U proxy -d proxy" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://proxy:proxy@localhost:5433/proxy
      APP_URL: http://localhost:3000
      # throwaway CI-only values (the test DB is discarded with the runner)
      SESSION_SECRET: ci-session-secret-ci-session-secret-ci-0123456789
      ENCRYPTION_KEY: MxC8P03PpxrJ5T9qTKCsCdAJZdWp8bw6HqZ7XdKMtAU=
      CRON_SECRET: ci-cron-secret
      GW_TEST_REDIS_URL: redis://localhost:6380
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
