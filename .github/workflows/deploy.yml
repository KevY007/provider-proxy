name: Deploy

# Every push to main deploys to Cloud Run once CI passed on that commit: build the image (Cloud Build), run the
# migration job on it, roll the service to it (traffic moves only when the new revision is healthy), smoke-test.
# Keyless: GitHub's OIDC token is exchanged for a short-lived Google token (Workload Identity Federation).
# Everything deployment-specific is a repository variable (Settings > Secrets and variables > Actions > Variables);
# deploy/README.md "Continuous deployment" lists them. Without GCP_PROJECT_ID the workflow does nothing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$SERVICE/$SERVICE:${SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit . --project="$PROJECT" --region="$REGION" \
            --config=deploy/cloudbuild-image.yaml --substitutions="_IMAGE=$IMAGE" \
            --service-account="${{ vars.GCP_BUILD_SA }}" \
            --gcs-source-staging-dir="gs://${{ vars.GCP_BUILD_BUCKET }}/source" --suppress-logs

      - name: Migrate the database
        run: |
          gcloud run jobs update "$SERVICE-migrate" --project="$PROJECT" --region="$REGION" --image="$IMAGE"
          gcloud run jobs execute "$SERVICE-migrate" --project="$PROJECT" --region="$REGION" --wait

      - name: Deploy the service
        run: |
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$IMAGE" --quiet
          # keep the seed job on the same image (run it by hand: gcloud run jobs execute "$SERVICE-seed")
          gcloud run jobs update "$SERVICE-seed" --project="$PROJECT" --region="$REGION" --image="$IMAGE" --quiet || true

      - name: Smoke test
        run: |
          URL="${{ vars.PUBLIC_URL }}"
          [ -n "$URL" ] || URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$URL/api/healthz"; then echo; echo "healthy: $URL"; exit 0; fi
            sleep 10
          done
          echo "health check failed: $URL" >&2
          exit 1
